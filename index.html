<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letters that react one at a time · Interaction recipes</title>
<meta name="description" content="Each letter of a name gets its own hover animation, and neighbours never share one. A recipe by Miguel Clavel.">
<style>
  :root { --page: #F9F9FB; --ink: #1D1D21; --muted: #67676C; --rule: #DADADD; }
  @media (prefers-color-scheme: dark) { :root { --page: #0F0F11; --ink: #F5F5F7; --muted: #A3A3A8; --rule: #2E2E33; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--page); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
  h1 { margin: 0; font-size: clamp(48px, 11vw, 140px); font-weight: 750; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; perspective: 600px; }
  h1 i { display: inline-block; font-style: normal; cursor: default; }
  h1 .gap { width: 0.28em; }
  .hint { position: fixed; left: 0; right: 0; bottom: 20px; text-align: center; font-size: 13px; color: var(--muted); }
  .hint a { color: inherit; }
  body.embed .hint { display: none; }

  /* Eight short animations. Each letter gets one, cycled so neighbours never match. */
  @keyframes squash { 0%{transform:scale(1,1)} 16%{transform:scale(1.25,.75)} 33%{transform:scale(.75,1.25)} 50%{transform:scale(1.15,.85)} 66%{transform:scale(.95,1.05)} 83%{transform:scale(1.05,.95)} 100%{transform:scale(1,1)} }
  @keyframes tip    { 0%{transform:rotate(0) translateY(0)} 20%{transform:rotate(80deg) translateY(10px)} 40%{transform:rotate(60deg) translateY(-5px)} 60%{transform:rotate(80deg) translateY(5px)} 80%{transform:rotate(60deg) translateY(-2px)} 100%{transform:rotate(0) translateY(0)} }
  @keyframes drop   { 0%{transform:scaleY(1) translateY(0)} 33%{transform:scaleY(.6) translateY(20px)} 66%{transform:scaleY(1.2) translateY(-40px)} 100%{transform:scaleY(1) translateY(0)} }
  @keyframes flip   { 0%{transform:rotateX(0) scale(1)} 12%{transform:rotateX(240deg) scale(1.1)} 24%{transform:rotateX(150deg) scale(1.05)} 36%{transform:rotateX(200deg) scale(1.05)} 48%{transform:rotateX(175deg) scale(1)} 60%,85%{transform:rotateX(180deg) scale(1)} 100%{transform:rotateX(0) scale(1)} }
  @keyframes slide  { 0%{transform:translateX(0)} 20%{transform:translateX(-20px)} 40%{transform:translateX(15px)} 60%{transform:translateX(-10px)} 80%{transform:translateX(5px)} 100%{transform:translateX(0)} }
  @keyframes shiver { 0%{transform:translate(0,0) rotate(0)} 14%{transform:translate(-5px,-2px) rotate(-1deg)} 28%{transform:translate(5px,2px) rotate(1deg)} 42%{transform:translate(-5px,-1px) rotate(-.5deg)} 56%{transform:translate(5px,1px) rotate(.5deg)} 70%{transform:translate(-2px,0)} 85%{transform:translate(2px,0)} 100%{transform:translate(0,0)} }
  @keyframes pop    { 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }
  @keyframes hop    { 0%{transform:translateY(0) scale(1)} 50%{transform:translateY(-30px) scale(1.1)} 100%{transform:translateY(0) scale(1)} }
  @media (prefers-reduced-motion: reduce) { h1 i { animation: none !important; } }
</style>
</head>
<body>
<main><h1 id="name" aria-label="Miguel Clavel">Miguel Clavel</h1></main>
<footer><p class="hint">Move your mouse across the letters (or tap them). <a href="https://github.com/miguelclavel/name-hover">Code and prompt</a></p></footer>
<script>
  // name, duration in ms, easing, transform origin
  const MOVES = [
    ['squash', 800, 'ease-in-out', 'center center'],
    ['tip', 1200, 'cubic-bezier(.175,.885,.32,1.275)', 'bottom left'],
    ['drop', 600, 'ease-out', 'bottom center'],
    ['flip', 2000, 'ease-out', '50% 80%'],
    ['slide', 800, 'ease-in-out', 'center center'],
    ['shiver', 500, 'linear', 'center center'],
    ['pop', 500, 'ease-in-out', 'center center'],
    ['hop', 1200, 'ease-in-out', 'center center']
  ];
  const params = new URLSearchParams(location.search);
  if (params.has('embed')) document.body.classList.add('embed');

  // Split the heading into one element per letter. Spaces stay plain gaps.
  const h1 = document.getElementById('name');
  const text = h1.textContent;
  h1.textContent = '';
  let n = 0;
  for (const ch of text) {
    const el = document.createElement('i');
    el.setAttribute('aria-hidden', 'true');
    if (ch === ' ') { el.className = 'gap'; h1.append(el); continue; }
    el.textContent = ch;
    const [name, ms, ease, origin] = MOVES[n++ % MOVES.length];
    el.style.transformOrigin = origin;
    // React to the exact letter under the pointer, never the whole word, and let
    // an animation finish before it can play again.
    const play = () => { if (el.style.animationName !== name) el.style.animation = `${name} ${ms}ms ${ease} both`; };
    el.addEventListener('mouseenter', play);
    el.addEventListener('click', play);
    el.addEventListener('animationend', () => { el.style.animation = 'none'; });
    h1.append(el);
  }

  // ?demo freezes a few letters part way through their moves, for the README picture.
  if (params.has('demo')) {
    const letters = h1.querySelectorAll('i:not(.gap)');
    for (const [i, at] of [[0, 0.16], [2, 0.62], [6, 0.5], [8, 0.33]]) {
      const [name, ms, ease] = MOVES[i % MOVES.length];
      letters[i].style.animation = `${name} ${ms}ms ${ease} -${Math.round(ms * at)}ms both paused`;
    }
  }
</script>
</body>
</html>
